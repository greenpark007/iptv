<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park IPTV Live</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}
.header{
    height:60px;
    background:#1b1b1b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:bold;
    border-bottom:1px solid #333;
}
.container{
    display:flex;
    height:calc(100vh - 60px);
}
.sidebar{
    width:320px;
    background:#161616;
    overflow-y:auto;
    border-right:1px solid #333;
}
/* 分组标题样式 */
.group-header {
    background: #222;
    padding: 12px 16px;
    font-weight: bold;
    font-size: 16px;
    border-bottom: 1px solid #333;
    border-top: 1px solid #333;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
}
.group-header:hover {
    background: #2b2b2b;
}
.group-header::after {
    content: '▼';
    font-size: 12px;
    transition: transform 0.2s;
}
.group-header.collapsed::after {
    transform: rotate(-90deg);
}
/* 分组频道容器 */
.group-channels {
    transition: max-height 0.3s ease-out;
    overflow: hidden;
}
.group-channels.collapsed {
    max-height: 0 !important;
}
/* 频道节点样式 */
.channel{
    padding:12px 16px 12px 30px;
    border-bottom:1px solid #2b2b2b;
    cursor:pointer;
    transition:0.2s;
    font-size:15px;
    display:flex;
    align-items:center;
}
.channel:hover{
    background:#222;
    color:#00ff66;
}
.channel.active {
    background:#1f2d24;
    color:#00ff66;
    font-weight:bold;
    border-left:4px solid #00ff66;
    padding-left:26px;
}
.channel-logo {
    width: 24px;
    height: 24px;
    margin-right: 10px;
    object-fit: contain;
    background: #222;
    border-radius: 4px;
}
.player-area{
    flex:1;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    position: relative;
}
video{
    width:100%;
    height:100%;
    background:#000;
}
.status{
    position:absolute;
    top:75px;
    right:20px;
    background:#1c1c1c;
    padding:10px 16px;
    border-radius:20px;
    color:#00ff66;
    font-size:15px;
    z-index: 10;
}
</style>
</head>
<body>

<div class="header">
📺 Park IPTV Live
</div>

<div class="status">GitHub Pages IPTV</div>

<div class="container">
    <div class="sidebar" id="channelList"></div>
    <div class="player-area">
        <video id="video" controls autoplay></video>
    </div>
</div>

<script>
// 你原本内置的默认测试频道
const defaultChannels = [
    { name: "凤凰资讯", url: "http://43.152.224.209/qctv.fengshows.cn/live/0701pin72.flv", group: "内置测试" },
    { name: "凤凰中文", url: "http://43.152.224.209/qctv.fengshows.cn/live/0701pcc72.flv", group: "内置测试" },
    { name: "凤凰香港", url: "http://43.152.224.209/qctv.fengshows.cn/live/0701phk72.flv", group: "内置测试" },
    { name: "Big Buck Bunny 测试", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", group: "内置测试" }
];

const listContainer = document.getElementById('channelList');
const video = document.getElementById('video');
let hls;
let activeChannelElement = null;

// 解析 M3U 字符串的函数
function parseM3U(m3uRawText) {
    const lines = m3uRawText.split(/\r?\n/);
    const result = [];
    let currentItem = null;

    lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
            currentItem = {};
            // 提取频道名称 (取逗号后面的最后一部分)
            const commaIndex = line.lastIndexOf(',');
            if (commaIndex !== -1) {
                currentItem.name = line.substring(commaIndex + 1).trim();
            }
            
            // 提取 tvg-logo
            const logoMatch = line.match(/tvg-logo="([^"]+)"/);
            if (logoMatch) currentItem.logo = logoMatch[1];

            // 提取 group-title 分组
            const groupMatch = line.match(/group-title="([^"]+)"/);
            currentItem.group = groupMatch ? groupMatch[1] : "其他频道";
        } else if (line && !line.startsWith('#')) {
            if (currentItem) {
                currentItem.url = line;
                result.push(currentItem);
                currentItem = null;
            }
        }
    });
    return result;
}

// 渲染播放列表到屏幕上（按分组归类）
function renderPlaylist(allChannels) {
    listContainer.innerHTML = '';
    
    // 按 group 分组
    const groups = {};
    allChannels.forEach(ch => {
        if (!groups[ch.group]) groups[ch.group] = [];
        groups[ch.group].push(ch);
    });

    // 循环建立 DOM 节点
    Object.keys(groups).forEach(groupName => {
        // 创建分组标题
        const groupHeader = document.createElement('div');
        groupHeader.className = 'group-header';
        groupHeader.innerText = `${groupName} (${groups[groupName].length})`;
        listContainer.appendChild(groupHeader);

        // 创建存放频道的容器
        const channelsContainer = document.createElement('div');
        channelsContainer.className = 'group-channels';
        listContainer.appendChild(channelsContainer);

        // 点击分组标题可以折叠/展开
        groupHeader.onclick = () => {
            groupHeader.classList.toggle('collapsed');
            channelsContainer.classList.toggle('collapsed');
        };

        // 渲染此分组下的所有频道
        groups[groupName].forEach(ch => {
            const div = document.createElement('div');
            div.className = 'channel';
            
            // 频道图标支持 (如果有的话)
            if (ch.logo) {
                const img = document.createElement('img');
                img.className = 'channel-logo';
                img.src = ch.logo;
                img.onerror = () => img.style.display = 'none'; // 图片加载失败时隐藏
                div.appendChild(img);
            }
            
            const nameSpan = document.createElement('span');
            nameSpan.innerText = ch.name;
            div.appendChild(nameSpan);

            div.onclick = () => {
                if(activeChannelElement) activeChannelElement.classList.remove('active');
                div.classList.add('active');
                activeChannelElement = div;
                playChannel(ch.url);
            };
            
            channelsContainer.appendChild(div);
        });
    });
}

// 核心播放控制
function playChannel(url){
    if(hls){
        hls.destroy();
    }

    // 清空一些不兼容格式遗留的属性
    video.src = ''; 
    
    // 兼容常见直播格式：判断是否为 HLS 串流 (.m3u8)
    if(Hls.isSupported() && (url.includes('.m3u8') || url.includes('stream04'))){
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED,function(){
            video.play().catch(e => console.log("自动播放被阻拦:", e));
        });
        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                console.warn('HLS 致命错误，尝试原生加载:', data);
                video.src = url;
                video.play().catch(e => {});
            }
        });
    } else {
        // FLV 或是 直播源直接链接通过原生的标准组件加载 (部分浏览器需要原生环境支持)
        video.src = url;
        video.play().catch(e => console.log("播放失败，请检查源是否可用：", e));
    }
}

// 初始化加载流程
window.onload = () => {
    // 1. 获取包含在最下方的原始 M3U 数据
    const m3uRaw = document.getElementById('m3u-data').textContent;
    
    // 2. 解析文件
    const parsedChannels = parseM3U(m3uRaw);
    
    // 3. 组合默认测试频道与你上传的文件频道
    const finalPlaylist = [...defaultChannels, ...parsedChannels];
    
    // 4. 显示到左侧屏幕
    renderPlaylist(finalPlaylist);

    // 默认播放第一个频道
    if(finalPlaylist.length > 0) {
        playChannel(finalPlaylist[0].url);
        setTimeout(() => {
            const firstChannelEl = document.querySelector('.channel');
            if(firstChannelEl) {
                firstChannelEl.classList.add('active');
                activeChannelElement = firstChannelEl;
            }
        }, 300);
    }
};
</script>
