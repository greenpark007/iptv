<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Park IPTV Live</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}

header{
    background:#1e1e1e;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    border-bottom:2px solid #333;
}

.container{
    display:flex;
    height:calc(100vh - 60px);
}

.sidebar{
    width:280px;
    background:#181818;
    overflow-y:auto;
    border-right:1px solid #333;
}

.channel{
    padding:15px;
    border-bottom:1px solid #333;
    cursor:pointer;
    transition:0.2s;
}

.channel:hover{
    background:#333;
}

.player{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
}

video{
    width:100%;
    height:100%;
    background:black;
}

.status{
    position:absolute;
    top:70px;
    right:20px;
    background:#222;
    padding:8px 15px;
    border-radius:10px;
    color:#0f0;
    font-size:14px;
}

@media(max-width:768px){

.container{
    flex-direction:column;
}

.sidebar{
    width:100%;
    height:220px;
}

.player{
    height:calc(100vh - 280px);
}

}
</style>
</head>

<body>

<header>
📺 Park IPTV Live
</header>

<div class="status">
Cloudflare Pages IPTV
</div>

<div class="container">

<div class="sidebar" id="channelList">
</div>

<div class="player">
<video id="video" controls autoplay></video>
</div>

</div>

<script>

const channels = [

{
name:"测试频道 1",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
},

{
name:"韩国 KBS",
url:"https://test-streams.mux.dev/test_001/stream.m3u8"
},

{
name:"韩国 MBC",
url:"https://test-streams.mux.dev/dai-discontinuity-deltatre/manifest.m3u8"
},

{
name:"韩国 SBS",
url:"https://test-streams.mux.dev/bbb-abr/bbb.m3u8"
},

{
name:"Big Buck Bunny",
url:"https://test-streams.mux.dev/bbb-abr/bbb.m3u8"
}

];

const video = document.getElementById('video');
const list = document.getElementById('channelList');

function playChannel(url){

if(Hls.isSupported()){

if(window.hls){
window.hls.destroy();
}

const hls = new Hls();

window.hls = hls;

hls.loadSource(url);

hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){
video.play();
});

}else if(video.canPlayType('application/vnd.apple.mpegurl')){

video.src = url;

video.play();

}

}

channels.forEach(channel=>{

const div = document.createElement('div');

div.className = 'channel';

div.innerHTML = channel.name;

div.onclick = ()=>{

playChannel(channel.url);

};

list.appendChild(div);

});

playChannel(channels[0].url);

</script>

</body>
</html>
