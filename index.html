<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park IPTV Live</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}
.header{
    height:60px;
    background:#1b1b1b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:bold;
    border-bottom:1px solid #333;
}
.container{
    display:flex;
    height:calc(100vh - 60px);
}
.sidebar{
    width:300px;
    background:#161616;
    overflow-y:auto;
    border-right:1px solid #333;
}
.channel{
    padding:16px;
    border-bottom:1px solid #2b2b2b;
    cursor:pointer;
    transition:0.2s;
    font-size:18px;
}
.channel:hover{
    background:#222;
}
.player-area{
    flex:1;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}
video{
    width:100%;
    height:100%;
    background:#000;
}
.status{
    position:absolute;
    top:75px;
    right:20px;
    background:#1c1c1c;
    padding:10px 16px;
    border-radius:20px;
    color:#00ff66;
    font-size:15px;
}
</style>
</head>
<body>

<div class="header">
📺 Park IPTV Live
</div>

<div class="status">GitHub Pages IPTV</div>

<div class="container">

<div class="sidebar" id="channelList"></div>

<div class="player-area">
<video id="video" controls autoplay></video>
</div>

</div>

<script>
const channels = [
{
name:"凤凰资讯",
url:"http://43.152.224.209/qctv.fengshows.cn/live/0701pin72.flv"
},
{
name:"凤凰中文",
url:"http://43.152.224.209/qctv.fengshows.cn/live/0701pcc72.flv"
},
{
name:"凤凰香港",
url:"http://43.152.224.209/qctv.fengshows.cn/live/0701phk72.flv"
},
{
name:"凤凰香港备用",
url:"https://cdn6.163189.xyz/163189/fhhk"
},
{
name:"凤凰中文备用",
url:"https://cdn6.163189.xyz/163189/fhzw"
},
{
name:"凤凰资讯备用",
url:"https://cdn6.163189.xyz/163189/fhzx"
},
{
name:"Big Buck Bunny 测试",
url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
}
];

const list = document.getElementById('channelList');
const video = document.getElementById('video');
let hls;

channels.forEach((ch,index)=>{
    const div = document.createElement('div');
    div.className='channel';
    div.innerText=ch.name;
    div.onclick=()=>playChannel(ch.url);
    list.appendChild(div);
});

function playChannel(url){

    if(hls){
        hls.destroy();
    }

    if(Hls.isSupported() && url.includes('.m3u8')){
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED,function(){
            video.play();
        });
    }else{
        video.src = url;
        video.play();
    }
}

playChannel(channels[0].url);
</script>

</body>
</html>
