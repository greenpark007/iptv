<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park IPTV Live</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" />

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    margin:0;
    background:#0f1117;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#151922;
    padding:15px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom:1px solid #333;
}

.container{
    display:flex;
    height:calc(100vh - 70px);
}

.sidebar{
    width:320px;
    background:#161b26;
    overflow-y:auto;
    border-right:1px solid #333;
}

.channel{
    padding:14px;
    cursor:pointer;
    border-bottom:1px solid #252b38;
    transition:0.2s;
}

.channel:hover{
    background:#283041;
}

.player-area{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#000;
}

video{
    width:100%;
    height:100%;
    background:black;
}

.status{
    position:absolute;
    top:80px;
    right:20px;
    background:#111;
    padding:10px 15px;
    border-radius:10px;
    opacity:0.8;
    font-size:14px;
}

@media(max-width:900px){
    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:260px;
    }
}
</style>
</head>

<body>

<header>
📺 Park IPTV Live
</header>

<div class="container">

<div class="sidebar" id="channelList">
</div>

<div class="player-area">
    <video id="video" controls autoplay></video>
</div>

</div>

<div class="status">
Cloudflare Pages IPTV
</div>

<script>

const channels = [

{
name:"CCTV1",
url:"http://www.liangcl.top:8686/udp/233.50.201.1:5140
"
},

{
name:"韩国 KBS",
url:"http://www.liangcl.top:8686/udp/233.50.201.1:5140
"
},

{
name:"韩国 MBC",
url:"https://test-streams.mux.dev/dai-discontinuity-deltatre/manifest.m3u8"
},

{
name:"韩国 SBS",
url:"https://test-streams.mux.dev/bbb-abr/bbb.m3u8"
}

];

const video = document.getElementById('video');
const list = document.getElementById('channelList');

function playStream(url){

    if(Hls.isSupported()){

        const hls = new Hls();

        hls.loadSource(url);

        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED,function(){
            video.play();
        });

    }else if(video.canPlayType('application/vnd.apple.mpegurl')){

        video.src = url;

        video.addEventListener('loadedmetadata',function(){
            video.play();
        });

    }
}

channels.forEach(ch => {

    const div = document.createElement('div');

    div.className = 'channel';

    div.innerText = ch.name;

    div.onclick = () => playStream(ch.url);

    list.appendChild(div);

});

playStream(channels[0].url);

</script>

</body>
</html>
